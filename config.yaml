runtime:
  random_seed: 2026
  device: cpu
  execution_type: local_python
  requires_gpu: false
  requires_external_api: false

model:
  name: stay_switch_kalman_v0_2
  type: two_stage_cognitive_model
  fitted_params_path: artifacts/fitted_params.json

  # Fallback values and optimizer starting points used when artifact loading
  # is disabled by fit_public.py. Frozen artifact values take precedence
  # during normal evaluation.
  initial_value: 50.0
  initial_variance: 400.0
  process_variance: 25.0
  observation_variance: 100.0
  variance_ceiling: 10000.0

  value_sensitivity: 2.0
  uncertainty_sensitivity: 0.15
  stay_intercept: 0.0
  stay_value_weight: 1.0
  surprise_linear_weight: 0.0
  surprise_quadratic_weight: 0.0
  run_length_weight: 0.0
  trial_index_weight: 0.0
  lapse: 0.02

evaluation:
  allow_online_state_updates: true
