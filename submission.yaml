# MindRL Challenge submission metadata.

team:
  team_id: the_brain_crackers
  display_name: The Brain Crackers
  members:
    - name: Lei
      email: lei.1.luo@kcl.ac.uk
      role: model development

submission:
  visibility: internal
  method_family: cognitive_reinforcement_learning_model
  short_description: >
    A fixed-noise Kalman choice model with trajectory-local reward and choice
    history, expressed as a dynamic stay gate and conditional switch-target
    probabilities. Global coefficients are fitted offline on public data.
  repo_url: https://github.com/mindrl-challenge/submission-the-brain-crackers.git
  agent_path: agent.py
  config_path: config.yaml
  requirements_path: requirements.txt
  interpretation_card_path: interpretation_card.md

optional_targets: []

runtime_profile:
  execution_type: local_python
  model_family: symbolic_cognitive
  requires_gpu: false
  gpu_type: null
  requires_external_api: false
  required_secrets: []
  estimated_eval_cost: none
  expected_runtime_minutes: null
  notes: "Choice-only cognitive model running inside the evaluator on CPU."

artifacts:
  hf_checkpoint: null
  external_weights: null
  notes: >
    Frozen global parameters are stored locally in
    artifacts/fitted_params_final.json; no external download is required.

policy:
  ip_owner: submitting_team
  access_scope: challenge_internal
  public_release_opt_in: false
